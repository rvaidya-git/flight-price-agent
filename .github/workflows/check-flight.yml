name: Check BA SFO to BOM flight price

on:
  schedule:
    # TEMP TEST MODE:
    # Runs every 15 minutes at minute 7, 22, 37, and 52.
    # After confirming cron works, switch back to the production schedule.
    - cron: "7,22,37,52 * * * *"

  workflow_dispatch:

jobs:
  check-flight:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run flight checker
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
          PRICE_THRESHOLD_USD: ${{ secrets.PRICE_THRESHOLD_USD }}
        run: python check_flight.py
